<section
  class="min-h-full bg-gray-100 px-4 py-6 sm:px-6 lg:px-8 page-enter"
>
  <div class="mx-auto w-full max-w-3xl">
    <header class="border-b border-gray-200 pb-5">
      <h1 class="text-2xl font-semibold text-gray-950 sm:text-3xl">
        Meu perfil
      </h1>
      <p class="mt-1 text-sm text-gray-600">
        Gerencie suas informações pessoais e segurança da conta.
      </p>
    </header>

    <form class="mt-6 space-y-6" (submit)="$event.preventDefault()">
      <section
        class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm sm:p-6"
      >
        <div class="border-b border-gray-100 pb-4">
          <h2 class="text-lg font-semibold text-gray-900">Dados pessoais</h2>
          <p class="mt-1 text-sm text-gray-500">
            Estas informações serão exibidas na sua conta.
          </p>
        </div>

        <div class="mt-5 grid grid-cols-1 gap-5 sm:grid-cols-2">
          <label class="flex flex-col gap-2 text-sm font-medium text-gray-700">
            Nome
            <input
              type="text"
              name="nome"
              [(ngModel)]="novoNome"
              autocomplete="name"
              placeholder="Seu nome"
              class="h-11 rounded-lg border border-gray-300 px-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </label>

          <label class="flex flex-col gap-2 text-sm font-medium text-gray-700">
            E-mail
            <input
              type="email"
              name="email"
              [(ngModel)]="novoEmail"
              autocomplete="email"
              placeholder="voce@email.com"
              class="h-11 rounded-lg border border-gray-300 px-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </label>
        </div>

        <div class="mt-6 flex justify-end">
          <button
            type="button"
            (click)="alterarDadosDoUsuario()"
            [disabled]="salvandoDados"
            class="h-11 rounded-lg bg-blue-600 px-4 text-sm font-medium text-white transition hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer"
          >
            <svg
              *ngIf="salvandoDados"
              lucideIcon="loader-circle"
              class="animate-spin"
            ></svg>
            {{ salvandoDados ? "Salvando..." : "Salvar alterações" }}
          </button>
        </div>
      </section>

      <section
        class="rounded-lg border border-gray-200 bg-white p-5 shadow-sm sm:p-6"
      >
        <div class="border-b border-gray-100 pb-4">
          <h2 class="text-lg font-semibold text-gray-900">Alterar senha</h2>
          <p class="mt-1 text-sm text-gray-500">
            Use uma senha forte e exclusiva para sua conta.
          </p>
        </div>

        <div class="mt-5 grid grid-cols-1 gap-5">
          <label class="flex flex-col gap-2 text-sm font-medium text-gray-700">
            Senha atual
            <input
              type="password"
              name="senhaAtual"
              [(ngModel)]="senhaAtual"
              autocomplete="current-password"
              class="h-11 rounded-lg border border-gray-300 px-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
            />
          </label>

          <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
            <label
              class="flex flex-col gap-2 text-sm font-medium text-gray-700"
            >
              Nova senha
              <input
                type="password"
                name="novaSenha"
                [(ngModel)]="novaSenha"
                autocomplete="new-password"
                class="h-11 rounded-lg border border-gray-300 px-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              />
            </label>

            <label
              class="flex flex-col gap-2 text-sm font-medium text-gray-700"
            >
              Confirmar nova senha
              <input
                type="password"
                name="confirmarSenha"
                [(ngModel)]="confirmarSenha"
                autocomplete="new-password"
                class="h-11 rounded-lg border border-gray-300 px-3 text-gray-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
              />
            </label>
          </div>
        </div>

        <div class="mt-6 flex justify-end">
          <button
            type="button"
            (click)="alterarSenha()"
            class="h-11 rounded-lg border border-gray-300 bg-white px-4 text-sm font-medium text-gray-700 transition hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 cursor-pointer"
          >
            Atualizar senha
          </button>
        </div>
      </section>
    </form>
  </div>
</section>
