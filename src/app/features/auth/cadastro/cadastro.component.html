<section
  class="relative flex h-screen flex-col items-center justify-center overflow-hidden bg-gray-100 px-4"
>
  <div
    class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1554224155-8d04cb21cd6c')] bg-cover bg-center blur-sm"
  ></div>

  <div class="absolute inset-0 bg-black/40"></div>

  <div
    class="relative z-10 w-full max-w-sm rounded-lg bg-gray-100 p-8 shadow-md"
  >
    <div class="mb-6 border-b border-gray-300 pb-4">
      <h2 class="text-3xl font-semibold text-gray-500">Criar conta</h2>
      <p class="text-gray-400">
        Informe seus dados para começar a controlar suas finanças.
      </p>
    </div>

    <form>
      <div
        class="flex min-h-11 items-center rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500"
      >
        <label
          for="nome"
          class="mb-1 block cursor-pointer p-4 text-sm font-medium text-gray-600"
        >
          Nome
        </label>
        <input
          type="text"
          id="nome"
          name="nome"
          autocomplete="name"
          placeholder="Seu nome"
          class="w-full rounded-r-lg p-2.5 text-sm text-gray-800 outline-none placeholder-gray-400"
        />
      </div>

      <div
        class="mt-4 flex min-h-11 items-center rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500"
      >
        <label
          for="email"
          class="mb-1 block cursor-pointer p-4 text-sm font-medium text-gray-600"
        >
          Email
        </label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="seu@email.com"
          class="w-full rounded-r-lg p-2.5 text-sm text-gray-800 outline-none placeholder-gray-400"
        />
      </div>

      <div
        class="mt-4 flex min-h-11 items-center rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500"
      >
        <label
          for="senha"
          class="mb-1 block cursor-pointer p-4 text-sm font-medium text-gray-600"
        >
          Senha
        </label>
        <input
          type="password"
          id="senha"
          name="senha"
          autocomplete="new-password"
          placeholder="Crie uma senha"
          class="w-full rounded-r-lg p-2.5 text-sm text-gray-800 outline-none placeholder-gray-400"
        />
      </div>

      <button
        type="submit"
        class="mt-5 w-full cursor-pointer rounded-lg bg-blue-600 py-5 text-sm font-medium text-white transition hover:bg-blue-700"
      >
        Cadastrar
      </button>

      <p class="mt-4 text-sm text-gray-500">
        Já tem uma conta?
        <a href="/login" class="text-blue-600 hover:underline">Entrar</a>
      </p>
    </form>
  </div>
</section>
