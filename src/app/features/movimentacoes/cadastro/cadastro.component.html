<div
  class="flex flex-1 items-start justify-center bg-gray-100 py-0 sm:px-6 sm:py-6 lg:items-center lg:py-10"
>
  <div
    class="w-full max-w-md border-y border-gray-200 bg-white p-4 sm:rounded-xl sm:border sm:p-6 sm:shadow-md lg:max-w-2xl lg:p-8"
  >
    <!-- Cabeçalho -->
    <div class="mb-4 flex items-center justify-between sm:mb-5">
      <h2 class="text-lg font-semibold text-gray-700">
        {{ isEditando ? "Editar movimentação" : "Nova movimentação" }}
      </h2>
      <a
        routerLink="/movimentacoes"
        aria-label="Voltar para movimentações"
        class="flex h-10 w-10 items-center justify-center rounded-lg text-2xl font-bold text-gray-500 transition hover:bg-gray-100 hover:text-gray-700"
      >
        X
      </a>
    </div>

    <hr class="mb-4 text-gray-200 sm:mb-5" />

    <form
      id="movimentacaoForm"
      [formGroup]="camposFormulario"
      (ngSubmit)="salvarMovimentacao()"
      class="flex flex-col gap-4"
    >
      <!-- Tipo -->
      <div>
        <span class="mb-2 block text-sm font-medium text-gray-600">Tipo</span>
        <div class="grid grid-cols-2 gap-2">
          <label
            class="flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-200 text-sm text-gray-700 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50 has-[:checked]:text-blue-700"
          >
            <input
              type="radio"
              name="tipo"
              value="receita"
              formControlName="tipo"
              class="accent-blue-600"
            />
            Receita
          </label>
          <label
            class="flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-lg border border-gray-200 text-sm text-gray-700 transition has-[:checked]:border-red-400 has-[:checked]:bg-red-50 has-[:checked]:text-red-700"
          >
            <input
              type="radio"
              name="tipo"
              value="despesa"
              formControlName="tipo"
              class="accent-red-500"
            />
            Despesa
          </label>
        </div>
      </div>

      <!-- Descrição -->
      <div>
        <label
          for="descricao"
          class="mb-1 block text-sm font-medium text-gray-600"
        >
          Descrição
          <span *ngIf="isCampoInvalido('descricao')" class="text-red-500"
            >*</span
          >
        </label>
        <div class="relative">
          <input
            type="text"
            id="descricao"
            name="descricao"
            formControlName="descricao"
            placeholder="Ex: Supermercado"
            class="min-h-11 w-full rounded-lg border p-2.5 pr-10 text-sm text-gray-800 placeholder-gray-400 outline-none ring-0 focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          />
        </div>
        <p
          *ngIf="isCampoInvalido('descricao')"
          class="mt-1 text-xs text-red-500"
        >
          Digite uma descrição.
        </p>
      </div>

      <!-- Valor -->
      <div>
        <label for="valor" class="mb-1 block text-sm font-medium text-gray-600"
          >Valor</label
        >
        <div
          class="flex min-h-11 items-center rounded-lg border border-gray-300 focus-within:border-blue-500 focus-within:ring-1 focus-within:ring-blue-500"
        >
          <span
            class="select-none border-r border-gray-300 px-3 py-2.5 text-sm text-gray-500"
            >R$</span
          >
          <input
            id="valor"
            type="number"
            placeholder="0,00"
            name="valor"
            formControlName="valor"
            class="w-full rounded-r-lg p-2.5 text-sm text-gray-800 outline-none placeholder-gray-400"
          />
        </div>
        <p *ngIf="isCampoInvalido('valor')" class="mt-1 text-xs text-red-500">
          Digite um valor.
        </p>
      </div>

      <!-- Categoria e Data -->
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="flex-1">
          <label
            for="categoria"
            class="mb-1 block text-sm font-medium text-gray-600"
            >Categoria</label
          >
          <select
            id="categoria"
            name="categoria"
            formControlName="categoria"
            class="min-h-11 w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          >
            <option value="" disabled>Selecione...</option>
            @for (categoria of categorias; track categoria.id) {
              <option [value]="categoria.slug">{{ categoria.nome }}</option>
            }
          </select>

          <p
            *ngIf="isCampoInvalido('categoria')"
            class="mt-1 text-xs text-red-500"
          >
            Escolha uma categoria.
          </p>
        </div>

        <div class="flex-1">
          <label for="data" class="mb-1 block text-sm font-medium text-gray-600"
            >Data</label
          >
          <input
            id="data"
            type="date"
            name="data"
            formControlName="data"
            class="min-h-11 w-full rounded-lg border border-gray-300 p-2.5 text-sm text-gray-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"
          />
          <p *ngIf="isCampoInvalido('data')" class="mt-1 text-xs text-red-500">
            Escolha uma data.
          </p>
        </div>
      </div>

      <!-- Botões -->
      <div class="mt-2 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <a
          routerLink="/movimentacoes"
          class="min-h-11 rounded-lg border border-gray-300 px-5 py-2.5 text-center text-sm font-medium text-gray-600 transition hover:bg-gray-50"
        >
          Cancelar
        </a>
        <button
          type="submit"
          class="min-h-11 cursor-pointer rounded-lg bg-blue-600 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-blue-700"
        >
          {{ isEditando ? "Atualizar" : "Salvar" }}
        </button>
      </div>

      <app-modal
        [isOpen]="isModalOpen"
        title="Movimentação cadastrada!"
        message="A movimentação foi cadastrada com sucesso. O que deseja fazer?"
        confirmText="Voltar"
        cancelText="Adicionar outra"
        (close)="adicionarOutra()"
        (confirm)="voltarParaMovimentacoes()"
      ></app-modal>
    </form>
  </div>

  @if (mensagemSucesso) {
    <div
      class="fixed bottom-20 left-4 right-4 z-50 rounded-lg border border-green-300 bg-green-100 px-4 py-3 text-sm text-green-800 shadow-lg sm:bottom-6 sm:left-auto sm:right-6 sm:max-w-sm"
      role="alert"
    >
      {{ mensagemSucesso }}
    </div>
  }

  @if (mensagemErro) {
    <div
      class="fixed bottom-20 left-4 right-4 z-50 rounded-lg border border-red-300 bg-red-100 px-4 py-3 text-sm text-red-800 shadow-lg sm:bottom-6 sm:left-auto sm:right-6 sm:max-w-sm"
      role="alert"
    >
      {{ mensagemErro }}
    </div>
  }
</div>
