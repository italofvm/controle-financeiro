<article
  class="flex min-h-32 items-start justify-between gap-4 rounded-lg border border-gray-200 bg-white p-5 shadow-sm"
>
  <div class="min-w-0 flex-1">
    <p class="text-sm font-medium text-gray-500">
      {{ titulo }}
    </p>

    <strong
      class="mt-6 block break-words text-xl font-semibold leading-tight sm:text-2xl xl:text-3xl"
      [class.text-blue-600]="tipo === 'saldo' && valor >= 0"
      [class.text-green-600]="tipo === 'receita'"
      [class.text-red-600]="tipo === 'despesa' || valor < 0"
    >
      {{ valorFormatado }}
    </strong>
  </div>

  <div
    class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full shadow-sm"
    [class.bg-blue-100]="tipo === 'saldo'"
    [class.text-blue-600]="tipo === 'saldo'"
    [class.bg-green-100]="tipo === 'receita'"
    [class.text-green-600]="tipo === 'receita'"
    [class.bg-red-100]="tipo === 'despesa'"
    [class.text-red-600]="tipo === 'despesa'"
  >
    <svg [lucideIcon]="icone" class="h-5 w-5"></svg>
  </div>
</article>
